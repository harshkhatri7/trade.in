# Alembic configuration for HARSH QUANT OS.
#
# The database URL is deliberately **not** stored here. A tracked ini file is
# the wrong place for a credential, and Alembic interpolates values through
# ConfigParser, which mangles a `%` inside a password. `alembic/env.py`
# resolves the URL instead, in this order:
#
#   1. `HQOS_DATABASE_URL` environment variable  (tests and CI point a
#      throwaway database at the same migration code path)
#   2. `harsh_quant_os.config.Settings`           (reads local .env)
#
# Run migrations with:
#
#   python -m alembic upgrade head         apply everything
#   python -m alembic downgrade base       reverse everything
#   python -m alembic current              what is applied right now
#   python -m alembic history              the revision chain

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Intentionally empty: see the note above.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
