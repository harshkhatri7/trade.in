# =====================================================================
# HARSH QUANT OS - development services
# ---------------------------------------------------------------------
# Development only. Nothing here is a production topology, and nothing
# here can trade.
#
#   npm run db:start    -> docker compose up -d postgres
#   npm run db:logs     -> docker compose logs -f postgres
#   npm run db:stop     -> docker compose stop postgres
#   npm run db:reset    -> scripts\data\reset-database.ps1 -Force
# =====================================================================

name: harsh-quant-os-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: harsh-quant-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-harsh_quant_os}
      POSTGRES_USER: ${DATABASE_USER:-harsh_quant_os}
      # Local development only. The real value comes from .env and is never
      # committed. The default below is deliberately not a secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-not-a-secret}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executed on first start, in alphabetical order.
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # The database is reachable only from this machine.
    networks:
      - local

  redis:
    image: redis:7-alpine
    container_name: harsh-quant-os-redis
    profiles: ['redis']
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local

volumes:
  pgdata:

networks:
  local:
    driver: bridge
