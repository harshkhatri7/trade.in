# =====================================================================
# HARSH QUANT OS - development services
# ---------------------------------------------------------------------
# Development only. Nothing here is a production topology, and nothing
# here can trade.
#
#   npm run db:start    -> docker compose up -d postgres
#   npm run db:logs     -> docker compose logs -f postgres
#   npm run db:stop     -> docker compose stop postgres
#   npm run db:reset    -> scripts\data\reset-database.ps1 -Force
# =====================================================================

name: harsh-quant-os-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: harsh-quant-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-harsh_quant_os}
      POSTGRES_USER: ${DATABASE_USER:-harsh_quant_os}
      # One credential source: the same DATABASE_PASSWORD the API reads from
      # .env, so the container and the application can never disagree about it.
      # The :? form aborts `docker compose up` loudly when the key is missing
      # or still a placeholder - run scripts\setup\provision-env.ps1 first.
      # This value is local-only and is never committed.
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD:?DATABASE_PASSWORD is not set - run scripts\setup\provision-env.ps1}'
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback only: the development database is never exposed to the LAN.
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executed on first start, in alphabetical order.
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # The database is reachable only from this machine.
    networks:
      - local

  redis:
    image: redis:7-alpine
    container_name: harsh-quant-os-redis
    profiles: ['redis']
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # Loopback only, and Redis has no password here - never expose it.
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local

volumes:
  pgdata:

networks:
  local:
    driver: bridge
