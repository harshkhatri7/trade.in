# =====================================================================
# HARSH QUANT OS - continuous integration
# ---------------------------------------------------------------------
# Runs install, format check, lint, type check and tests for both
# toolchains. It never deploys, never places an order, and has no access
# to production secrets.
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  typescript:
    name: TypeScript (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build web app (next build)
        run: npm run build:web

      - name: Dependency audit
        run: npm audit --audit-level=high

  python:
    name: Python (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # Dependencies live in pyproject.toml; without this the pip cache
          # looks for requirements.txt, finds nothing and fails the job.
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          # `dev` alone is not enough: `storage` (SQLAlchemy, Alembic,
          # asyncpg) and `quant` (NumPy, SciPy, statsmodels) were added by
          # later phases and are imported at module scope by src/ and
          # tests/. Installing only `dev` produced 92 mypy
          # import-not-found errors across 42 files - reproduced locally in
          # a clean venv before this line was changed.
          python -m pip install -e ".[dev,quant,storage]"

      - name: Check formatting (ruff format)
        run: python -m ruff format --check .

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Type check (mypy, strict)
        run: python -m mypy

      - name: Tests (pytest, includes security suite)
        run: python -m pytest -q

      - name: Coverage report (informational)
        run: python -m pytest --cov --cov-report=term-missing -q

  integration:
    name: Integration (API over HTTP, API to client to DOM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Phase 2 stores sessions in PostgreSQL, so this job is the one that has
    # to have a server. The service is the same image docker-compose.yml
    # uses, with the credential `Settings` already defaults to, so a fresh
    # clone and CI build an identical connection string. The flag is the
    # important half: without it, "the database was never there" skips and a
    # run whose database tests never executed looks exactly like a passing
    # one. It turns that into a failure.
    env:
      HQOS_REQUIRE_POSTGRES: '1'
      DATABASE_URL: postgresql+asyncpg://harsh_quant_os:replace-with-a-local-dev-password@127.0.0.1:5432/harsh_quant_os
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harsh_quant_os
          POSTGRES_PASSWORD: replace-with-a-local-dev-password
          POSTGRES_DB: harsh_quant_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harsh_quant_os -d harsh_quant_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (npm)
        run: npm ci --no-fund

      - name: Install project (Python, with dev extras)
        run: |
          python -m pip install --upgrade pip
          # Same three extras as the `python` job; the API process this job
          # starts cannot import without `storage`, and the suite imports
          # `quant`. See the note in the `python` job.
          python -m pip install -e ".[dev,quant,storage]"

      # The TypeScript integration suite starts a real API process. It is run
      # in its own job so that it cannot skip for lack of Python and still
      # report a green build; here `python` is on PATH and imports fastapi.
      - name: Integration tests (real API process -> typed client -> DOM)
        run: npm run test:integration

      - name: Integration tests (real API process over HTTP)
        run: python -m pytest tests/integration -q

  repo-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be tracked by git"
            exit 1
          fi
          echo "ok: .env is not tracked"

      - name: Fail if live trading is enabled in the template
        run: |
          if grep -Eiq '^LIVE_TRADING_ENABLED[[:space:]]*=[[:space:]]*true' .env.example; then
            echo "::error::LIVE_TRADING_ENABLED must be false in .env.example"
            exit 1
          fi
          echo "ok: live trading disabled in template"

      - name: Warn about large files
        run: |
          large=$(git ls-files | xargs -r du -k 2>/dev/null | awk '$1 > 2048 {print $1 "KB " $2}')
          if [ -n "$large" ]; then
            echo "::warning::Large files tracked in the repository:"
            echo "$large"
          fi
          echo "ok: scan complete"
